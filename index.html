<section id="home" class="screen home on"><div class="home-grid"><div><div class="brand"><img class="logo pixel" src="assets/tnda-logo.jpg" alt="TNDA">TNDA ROLE QUEST</div><h1 class="title">找到你在<span>團隊中的力量</span></h1><p class="lead">六個合作情境，探索你在這一輪團隊合作中最常啟動的力量，解鎖專屬的九型職業角色。</p><div class="pills"><span class="pill">6 道情境題</span><span class="pill">約 2 分鐘</span><span class="pill">9 種角色</span></div><button class="primary" id="start">開始探索 →</button></div><div class="hero"><img class="pixel" src="assets/tnda-logo.jpg" alt="TNDA 標誌"></div></div></section>

<section id="result" class="screen result"><div class="result-head"><div class="nav"><div class="brand"><img class="logo pixel" src="assets/tnda-logo.jpg" alt="">TNDA</div><span class="eyebrow">YOUR ROLE</span></div><div class="result-grid"><div class="charbox"><img id="character" class="character pixel" alt=""></div><div><div class="type" id="rtype"></div><h2 class="rtitle" id="rname"></h2><p class="role" id="role"></p><p class="summary" id="summary"></p><div class="actions"><button class="primary" id="restart">再測一次</button><button class="secondary" id="share">分享結果</button></div></div></div></div><div class="body"><article class="card"><h3>你在團隊的主要作用</h3><p class="effect" id="effect"></p></article><article class="card radar-card"><h3>六力雷達</h3><svg class="radar" id="radar" viewBox="0 0 420 390"></svg></article><article class="card"><h3>你的合作關鍵字</h3><div class="tags" id="tags"></div></article><article class="card"><h3>給這次合作的提醒</h3><p class="note" id="advice"></p><p class="fine">本測驗用於探索本輪合作傾向，不等同臨床或人格診斷。</p></article></div></section>
</main><script>
const B=[{q:"團體作業剛開始，大家都還沒講話。你會先做什麼？",a:[["先講出一個方向，讓大家有東西討論","action"],["先問每個人想做什麼","feeling"],["先把題目再看一遍，確認要解什麼","thinking"]]},{q:"進度落後了三天。",a:[["直接砍掉一些東西，先讓它動起來","action"],["先確認大家是否卡住","feeling"],["先找出到底是哪裡拖慢","thinking"]]},{q:"有人提出一個你沒想過的做法。",a:[["那就試試看，做了才知道","action"],["我想知道他為什麼這樣想","feeling"],["我想先知道這樣做有什麼後果","thinking"]]}];

const R={1:["改革者","鍊金術師","優化系統，讓作品更接近理想。","你看得見「還可以更好」的地方，習慣把混亂整理成標準，把模糊推向精準。",["原則清楚","品質把關","持續改善"],"區分必要修正與理想加分，讓進度與品質一起前進。",[2,4,5,1,4,2]],2:["助人者","牧師","支持與療癒，讓夥伴能繼續前進。","你敏銳察覺他人的需要，擅長補位與照顧氣氛，讓成員感到被接住。",["溫暖支持","主動補位","凝聚關係"],"照顧別人時，也把自己的需要說出來；清楚界線會讓善意走得更久。",[2,2,2,5,4,3]],3:["成就者","弓箭手","鎖定目標，加速團隊達成成果。","你能快速抓住目標與成功條件，把注意力集中在有效行動。",["目標導向","高效推進","成果意識"],"速度之外，也為團隊保留確認方向的時間。",[3,2,4,2,4,3]],4:["藝術家","吟遊詩人","改變場景，為團隊創造獨特視角。","你對感受與差異敏銳，能把個人觀點化成有辨識度的表達。",["美感直覺","獨特表達","情感深度"],"替創意設定可完成的邊界，讓別人真正看見它。",[3,5,2,4,2,2]],5:["觀察者","法師","找出弱點，用洞察破解複雜問題。","你習慣先退一步觀察，蒐集關鍵資訊，再在需要時給出精準判斷。",["深度觀察","理性分析","關鍵洞察"],"資訊永遠可以更多；當把握已足夠，就讓洞察提早加入行動。",[4,3,5,1,3,2]],6:["守衛者","騎士","預判風險，守住團隊的安全底線。","你對風險、責任和可靠度敏感，總能提前看到遺漏。",["風險意識","可靠守護","周全準備"],"先定義可接受風險，不必等到完全確定才前進。",[1,2,4,4,5,2]],7:["樂觀者","遊俠","打開未知路線，為團隊帶來新可能。","你對新鮮事物充滿能量，卡關時能快速找到另一條值得嘗試的路。",["好奇探索","彈性應變","創意點子"],"挑一條最值得的路走深，讓想像真正變成成果。",[5,4,2,4,2,1]],8:["挑戰者","戰士","打破障礙，推動團隊直接向前。","你相信直接行動，面對阻力不退縮，能快速站出來承擔。",["果斷行動","勇於承擔","直面挑戰"],"出手前多問一句，會讓你的力量帶著更多人前進。",[3,2,2,2,4,5]],9:["調解者","召喚師","化解衝突，讓不同力量重新合作。","你能理解多方立場、降低緊張並尋找共同點。",["包容理解","穩定氣氛","整合觀點"],"維持和平不代表隱藏立場；清楚說出重視的事，能讓共識更穩固。",[3,3,3,5,2,2]]};
let s=0,A=[],F;const $=x=>document.querySelector(x),show=x=>{document.querySelectorAll(".screen").forEach(e=>e.classList.toggle("on",e.id==x));scrollTo(0,0)},maj=(v,f)=>{let c={};v.forEach(x=>c[x]=(c[x]||0)+1);let m=Math.max(...Object.values(c)),w=Object.keys(c).filter(x=>c[x]==m);return w.length==1?(typeof v[0]=="number"?+w[0]:w[0]):f};
function render(){F=s>=3?maj(A.slice(0,3),A[2]):null;let d=s<3?B[s]:{q:Q[F][s-3][0],a:Q[F][s-3][1]};$("#count").textContent=s+1+" / 6";$("#fill").style.width=(s+1)/6*100+"%";$("#phase").textContent=s<3?"PHASE 01 · 你的合作驅動":"PHASE 02 · 你的角色傾向";$("#question").textContent=d.q;$("#back").style.visibility=s?"visible":"hidden";$("#answers").innerHTML="";d.a.forEach((a,i)=>{let b=document.createElement("button");b.className="answer";b.innerHTML='<span class="idx">'+String.fromCharCode(65+i)+'</span><span>'+a[0]+"</span>";b.onclick=()=>{b.classList.add("sel");A[s]=a[1];A=A.slice(0,s+1);setTimeout(()=>s<5?(s++,render()):result(maj(A.slice(3),A[5])),140)};$("#answers").append(b)})}
function result(t){let r=R[t];$("#character").src="assets/type-"+t+".png";$("#character").alt=r[0]+"－"+r[1]+"角色全身圖";$("#rtype").textContent="TYPE "+t+" · 本輪合作角色";$("#rname").textContent=r[0];$("#role").textContent=r[1];$("#effect").textContent=r[2];$("#summary").textContent=r[3];$("#tags").innerHTML=r[4].map(x=>'<span class="tag">'+x+"</span>").join("");$("#advice").textContent=r[5];radar(r[6]);show("result");document.title="我是 TNDA "+r[0]+"－"+r[1];$("#share").onclick=async()=>{let d={title:document.title,text:"我的 TNDA 團隊角色是 Type "+t+" "+r[0]+"－"+r[1]+"！",url:location.href};try{navigator.share?await navigator.share(d):await navigator.clipboard.writeText(d.text+" "+d.url)}catch(e){}}}
function radar(v){let L=["探索","創造","分析","連結","執行","創業"],cx=210,cy=190,R=130,P=a=>a.map((n,i)=>{let q=-Math.PI/2+i*Math.PI/3,r=R*n/5;return cx+Math.cos(q)*r+","+(cy+Math.sin(q)*r)}).join(" "),h="";for(let n=1;n<=5;n++)h+='<polygon points="'+P(Array(6).fill(n))+'" fill="none" stroke="#d9ccc0"/>';h+=L.map((l,i)=>{let q=-Math.PI/2+i*Math.PI/3,x=cx+Math.cos(q)*R,y=cy+Math.sin(q)*R;return '<line x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'" stroke="#ddd"/><text x="'+(cx+Math.cos(q)*(R+32))+'" y="'+(cy+Math.sin(q)*(R+32)+5)+'" text-anchor="middle" font-size="14" font-weight="800">'+l+"</text>"}).join("")+'<polygon points="'+P(v)+'" fill="#ff4b2366" stroke="#ff4b23" stroke-width="4"/>';$("#radar").innerHTML=h}
